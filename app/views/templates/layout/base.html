<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Alzikrayat
        {% endblock %}
    </title>
</head>

<body>

    <header>
        <nav>
            <a href="/">
                <strong>Alzikrayat</strong>
            </a>

            <a href="/">
                Home
            </a>

            <a href="/photos">
                Photos
            </a>

            <a href="/about">
                About
            </a>

            {% if session.get("userId") %}

                <span>
                    Hi {{ session.get("firstName") }}
                </span>

                <form
                    action="/logout"
                    method="POST"
                    style="display: inline;"
                >
                    <button type="submit">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="/login">
                    Please Login
                </a>

                <a href="/register">
                    Register
                </a>

            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script
        src="{{ url_for('static', filename='js/validation.js') }}"
    ></script>

</body>

</html>
