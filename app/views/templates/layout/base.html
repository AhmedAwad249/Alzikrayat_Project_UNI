<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share photos and memories on Alzikrayat.">
    <title>{% block title %}Alzikrayat{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
        <header class="site-header">
            <nav class="nav-bar page-width" aria-label="Main navigation">
                <a class="brand" href="/" aria-label="Alzikrayat home">
                    Alzikrayat<span class="brand-dot">.</span>
                </a>

                <div class="nav-links">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                    <a class="nav-link {% if request.path == '/photos' or (request.path.startswith('/photo/') and request.path != '/photo/upload') %}active{% endif %}" href="/photos">Gallery</a>
                    <a class="nav-link {% if request.path == '/users' or request.path.startswith('/user/') %}active{% endif %}" href="/users">People</a>
                    <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="/about">About</a>
                </div>

                <div class="nav-actions">
                    {% if session.get('userId') %}
                        <a class="text-link account-link {% if request.path == '/my-photos' %}active{% endif %}"
                           href="/my-photos" title="My profile">Hi, {{ session.get('firstName') }}</a>
                        <a class="button button-dark nav-upload" href="/photo/upload">Upload</a>
                        <form action="/logout" method="POST">
                            <button class="button button-outline" type="submit">Logout</button>
                        </form>
                    {% else %}
                        <a class="text-link {% if request.path == '/login' %}active{% endif %}" href="/login">Please Login</a>
                        <a class="button button-dark" href="/register">Sign up</a>
                    {% endif %}
                </div>
            </nav>
        </header>

        <main id="main-content" class="page-width">
            {% block content %}{% endblock %}
        </main>

    </div>
    <script src="{{ url_for('static', filename='js/validation.js') }}" defer></script>
</body>
</html>
